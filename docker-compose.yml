services:

  ai-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ai_business
      POSTGRES_USER: aiuser
      POSTGRES_PASSWORD: aipass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U aiuser -d ai_business" ]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-business:
    build: .
    ports:
      - "9000:9000"
    environment:
      DB_URL: jdbc:postgresql://ai-postgres:5432/ai_business
      DB_USERNAME: aiuser
      DB_PASSWORD: aipass
    depends_on:
      - ai-postgres

volumes:
  postgres-data: